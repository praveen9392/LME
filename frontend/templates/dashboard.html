<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LME Dashboard — Application Tracking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="logo">
    <img src="/static/img/logo2.svg" alt="LME" height="32" onerror="this.style.display='none'">
    <span>LME &mdash; Dashboard</span>
  </div>

  <div class="nav-links">
    <a href="/dashboard" class="nav-link active">📊 Dashboard</a>
    <a href="/setup" class="nav-link">⚙️ Setup Wizard</a>
  </div>

  <!-- Stat Cards -->
  <div class="stats">
    <div class="stat">
      <div class="val" id="stat-total" style="color:var(--accent)">0</div>
      <div class="lbl">Total Applied</div>
    </div>
    <div class="stat">
      <div class="val" id="stat-high" style="color:var(--ok)">0</div>
      <div class="lbl">Score &ge; 70</div>
    </div>
    <div class="stat">
      <div class="val" id="stat-mid" style="color:var(--warn)">0</div>
      <div class="lbl">Score 50&ndash;69</div>
    </div>
    <div class="stat">
      <div class="val" id="stat-low" style="color:var(--err)">0</div>
      <div class="lbl">Score &lt; 50</div>
    </div>
    <div class="stat">
      <div class="val" id="stat-noscore" style="color:var(--fg-m)">0</div>
      <div class="lbl">No Score</div>
    </div>
  </div>

  <!-- Charts -->
  <div class="charts">
    <div class="chart-box">
      <h3>Applications per Day (Last 30 Days)</h3>
      <canvas id="chart-daily"></canvas>
    </div>
    <div class="chart-box">
      <h3>Top Companies Applied</h3>
      <canvas id="chart-companies"></canvas>
    </div>
  </div>

  <!-- Applied Jobs Table -->
  <div class="chart-box" style="margin-bottom: 24px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
      <h3>Recent Applications</h3>
      <span id="record-count" style="font-size: 12px; color: var(--fg-m);"></span>
    </div>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Job Title</th>
            <th>Company</th>
            <th>Location</th>
            <th>Score</th>
            <th>Applied At</th>
          </tr>
        </thead>
        <tbody id="jobs-table-body">
          <tr>
            <td colspan="5" style="text-align: center; color: var(--fg-m); padding: 24px;">Loading applications...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="/static/js/dashboard.js"></script>
</body>
</html>
